# PostgreSQL for the database cases, on CPUs of its own (cpuset) apart from
# the server under test and the load generator; see docs/methodology.md.
# synchronous_commit=off removes the wait for the WAL flush of each commit,
# so that the write cases measure the frameworks rather than the disk; both
# profiles run with the same setting.
name: fastdrf-benchmarks
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: fastdrf_benchmarks
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: benchmark-local-only
    ports:
      - "127.0.0.1:${BENCH_PG_PORT:-55451}:5432"
    volumes: ["postgres:/var/lib/postgresql"]
    shm_size: 1gb
    cpuset: "${BENCH_PG_CPUS:-16-19}"
    mem_limit: 4g
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=200
      - -c
      - random_page_cost=1.1
      - -c
      - max_wal_size=2GB
      - -c
      - fsync=on
      - -c
      - synchronous_commit=off
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U bench -d fastdrf_benchmarks"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  postgres:
